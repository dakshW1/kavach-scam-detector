# Privacy: no usage statistics, and the app only listens on this computer (127.0.0.1).
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
address = "127.0.0.1"
port = 8501
headless = true
enableXsrfProtection = true

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1f3b63"
